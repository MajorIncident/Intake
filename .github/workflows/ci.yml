name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '30 10 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diff-aware guards compare the PR head with origin/${GITHUB_BASE_REF}.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality gate
        id: quality
        timeout-minutes: 10
        run: npm run quality

      - name: Install Chromium for required browser gate
        timeout-minutes: 8
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run required browser regression suite
        run: npm run test:browser

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-test-results
          path: |
            test-results/
            playwright-report/
            npm-debug.log*
          if-no-files-found: ignore
