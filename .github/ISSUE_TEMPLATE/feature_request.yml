name: Feature request
description: Propose a product or repository improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow problem before proposing implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier, safer, or more reliable?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or invariants
      description: Note storage, summary, accessibility, privacy, compatibility, or KT-method constraints.
